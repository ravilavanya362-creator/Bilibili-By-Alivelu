<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h2 { margin-bottom: 20px; color: #222; }
    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #fd7e14; cursor: not-allowed; }
    #status-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #eef5ff;
      border: 1px solid #d0e1fd;
      color: #0d6efd;
      font-size: 15px;
      font-weight: bold;
      display: none;
    }
    #result {
      margin-top: 20px;
      display: none;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
    #thumb {
      width: 100%;
      border-radius: 8px;
      margin: 10px 0;
      max-height: 220px;
      object-fit: cover;
    }
    .dl-btn {
      display: block;
      background: #28a745;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Video Downloader</h2>
  <input type="text" id="url" placeholder="Bilibili Video URL ikkada paste cheyandi">
  <button id="btn" onclick="startDownload()">డౌన్‌లోడ్ లింక్ తీయి</button>

  <div id="status-box"></div>

  <div id="result">
    <p id="title" style="font-weight: bold; color: #333; font-size: 14px;"></p>
    <img id="thumb" src="" alt="Thumbnail">
    <a id="downloadLink" class="dl-btn" href="#">📥 సేవ్ చేసుకోండి (Download Video)</a>
  </div>
</div>

<script>
  async function startDownload() {
    const url = document.getElementById('url').value.trim();
    const btn = document.getElementById('btn');
    const statusBox = document.getElementById('status-box');
    const result = document.getElementById('result');

    if (!url) {
      alert("దయచేసి లింక్ పేస్ట్ చేయండి!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳ ప్రాసెస్ అవుతోంది...";
    statusBox.style.display = "block";
    statusBox.innerHTML = "📥 Downloading Video & Audio... దయచేసి ఆగండి...";
    result.style.display = "none";

    const timer = setTimeout(() => {
      statusBox.innerHTML = "⚙️ Merging Video + Audio... మరికొన్ని క్షణాలు...";
    }, 10000);

    try {
      const res = await fetch('http://localhost:5000/get-video', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      });

      clearTimeout(timer);
      const data = await res.json();

      if (data.error) {
        alert("ఎర్రర్: " + data.error);
        statusBox.style.display = "none";
      } else {
        statusBox.innerHTML = "✅ Download & Merging Complete!";
        document.getElementById('title').innerText = data.title;
        if (data.thumbnail) {
          document.getElementById('thumb').src = data.thumbnail;
          document.getElementById('thumb').style.display = "block";
        } else {
          document.getElementById('thumb').style.display = "none";
        }
        document.getElementById('downloadLink').href = data.download_url;
        result.style.display = "block";
      }
    } catch (err) {
      clearTimeout(timer);
      alert("సర్వర్‌కు కనెక్ట్ కాలేకపోయింది!");
      statusBox.style.display = "none";
    } finally {
      btn.disabled = false;
      btn.innerText = "డౌన్‌లోడ్ లింక్ తీయి";
    }
  }
</script>

</body>
</html>
